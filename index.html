<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis IDE - Java Environment</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/beach_engineer.png" type="image/png">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GRSDD2NJSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GRSDD2NJSF');
    </script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <div class="app-background">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
    </div>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="beach-engineer-container" title="Oasis IDE Mascot">
                    <img src="assets/beach_engineer.png" alt="Relaxing" class="beach-engineer-frame frame-1">
                    <img src="assets/beach_engineer_drinking.png" alt="Drinking" class="beach-engineer-frame frame-2">
                </div>
                <div>
                    <h1>Oasis IDE</h1>
                    <p>Lightning fast, client-side Java environment</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span>Theme</span>
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="editor-section glass-panel">
                <div class="panel-header">
                    <h2>Code Editor</h2>
                    <div class="editor-actions">
                        <button id="formatBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8l1.4 1.4"/><path d="M17.8 6.2l1.4-1.4"/><path d="M12.2 6.2l-1.4-1.4"/><path d="m3 21 9-9"/><path d="M12.2 11.8l-1.4 1.4"/></svg>
                            <span>Format</span>
                        </button>
                        <button id="resetBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            <span>Reset</span>
                        </button>
                        <button id="clearBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            <span>Clear</span>
                        </button>
                        <button id="runBtn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <span>Run</span>
                        </button>
                    </div>
                </div>
                <div id="editor" class="editor"></div>
            </div>

            <div class="output-section glass-panel">
                <div class="panel-header">
                    <h2>Output Console</h2>
                </div>
                <div id="output" class="output">
                    <div class="output-placeholder">Ready to compile. Awaiting execution...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Compiling Java...</p>
    </div>

    <!-- Application Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
