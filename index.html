<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis IDE - Java Environment</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/beach_engineer.png" type="image/png">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GRSDD2NJSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GRSDD2NJSF');
    </script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <div class="app-background">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
    </div>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="beach-engineer-container" title="Oasis IDE Mascot">
                    <img src="assets/beach_engineer.png" alt="Relaxing" class="beach-engineer-frame frame-1">
                    <img src="assets/beach_engineer_drinking.png" alt="Drinking" class="beach-engineer-frame frame-2">
                </div>
                <div>
                    <h1>Oasis IDE</h1>
                    <p>Lightning fast, client-side Java environment</p>
                </div>
            </div>
            <div class="header-actions">
                <select id="templateSelector" class="select-dropdown header-select">
                    <option value="">-- Load Template --</option>
                    <optgroup label="Starter Templates">
                        <option value="Hello Java">Hello Java</option>
                        <option value="Map & Set Iterator">Map & Set Iterator</option>
                        <option value="Fibonacci (DP)">Fibonacci (DP)</option>
                        <option value="Binary Tree DFS">Binary Tree DFS</option>
                    </optgroup>
                    <optgroup label="Algorithms & Snippets">
                        <option value="Binary Search">Binary Search</option>
                        <option value="Bubble Sort">Bubble Sort</option>
                        <option value="Reverse Linked List">Reverse List</option>
                        <option value="Graph BFS">Graph BFS</option>
                        <option value="Frequency Map">Frequency Map</option>
                    </optgroup>
                </select>
                <button id="themeToggleBtn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span>Theme</span>
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Collapsible Sidebar -->
            <div class="sidebar glass-panel">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="challenges" title="Challenges (🏆)">🏆</button>
                    <button class="tab-btn" data-tab="debugger" title="Debugger (🐞)">🐞</button>
                </div>
                <div class="sidebar-content">
                    <!-- Challenges Panel -->
                    <div class="tab-pane active" id="pane-challenges">
                        <div class="pane-header">
                            <h3>Challenges</h3>
                        </div>
                        <select id="challengeSelector" class="select-dropdown">
                            <option value="">-- Select Challenge --</option>
                            <option value="two-sum">Two Sum (Easy)</option>
                            <option value="palindrome-number">Palindrome Number (Easy)</option>
                            <option value="reverse-string">Reverse String (Easy)</option>
                        </select>
                        <div id="challengeDetailPanel" class="hidden">
                            <div class="difficulty-tag easy">Easy</div>
                            <div id="challengeDesc" class="challenge-desc"></div>
                            <button id="runTestsBtn" class="btn btn-primary" style="margin-top:12px; width:100%; justify-content:center;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                Run Tests
                            </button>
                        </div>
                    </div>
                    <!-- Debugger Panel -->
                    <div class="tab-pane" id="pane-debugger">
                        <div class="pane-header">
                            <h3>Debugger</h3>
                        </div>
                        <div class="debug-controls">
                            <button id="debugStartBtn" class="btn btn-primary" style="width:100%; justify-content:center;">🐞 Start Debug Session</button>
                            <div id="debugActiveGroup" class="hidden" style="margin-top:12px;">
                                <div class="debug-buttons-row">
                                    <button id="debugResumeBtn" class="btn btn-primary" title="Resume (Play)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></button>
                                    <button id="debugStepBtn" class="btn btn-secondary" title="Step Over"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
                                    <button id="debugStopBtn" class="btn btn-secondary btn-danger" title="Stop"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg></button>
                                </div>
                                <div class="debug-status">
                                    <span class="pulse-indicator red"></span> Paused on Line <span id="debugLineNum">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor Section -->
            <div class="editor-section glass-panel">
                <div class="panel-header">
                    <div class="panel-title-group">
                        <h2>Code Editor</h2>
                        <span class="auto-import-badge" title="Standard libraries like Map, List, Arrays, etc. are automatically imported on run/format">⚡ Auto-Imports Enabled</span>
                    </div>
                    <div class="editor-actions">
                        <button id="formatBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8l1.4 1.4"/><path d="M17.8 6.2l1.4-1.4"/><path d="M12.2 6.2l-1.4-1.4"/><path d="m3 21 9-9"/><path d="M12.2 11.8l-1.4 1.4"/></svg>
                            <span>Format</span>
                        </button>
                        <button id="resetBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            <span>Reset</span>
                        </button>
                        <button id="clearBtn" class="btn btn-ghost">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            <span>Clear</span>
                        </button>
                        <button id="runBtn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <span>Run</span>
                        </button>
                    </div>
                </div>
                <div id="editor" class="editor"></div>
            </div>

            <div class="output-section glass-panel">
                <div class="panel-header">
                    <h2>Output Console</h2>
                </div>
                <div id="output" class="output">
                    <div class="output-placeholder">Ready to compile. Awaiting execution...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Compiling Java...</p>
    </div>

    <!-- Application Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
