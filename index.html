<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis IDE - Java Environment</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/logo.png" type="image/png">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <div class="app-background"></div>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <img src="assets/logo.png" alt="Oasis Logo" class="app-logo">
                <div>
                    <h1>Oasis IDE</h1>
                    <p>Lightning fast, client-side Java environment</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="btn btn-secondary">🌙 Dark Mode</button>
            </div>
        </header>

        <div class="main-content">
            <div class="editor-section glass-panel">
                <div class="panel-header">
                    <h2>Code Editor</h2>
                    <div class="editor-actions">
                        <button id="formatBtn" class="btn btn-ghost">✨ Format</button>
                        <button id="resetBtn" class="btn btn-secondary">↻ Reset</button>
                        <button id="clearBtn" class="btn btn-ghost">🗑 Clear Log</button>
                        <button id="runBtn" class="btn btn-primary">▶ Run Code</button>
                    </div>
                </div>
                <div id="editor" class="editor"></div>
            </div>

            <div class="output-section glass-panel">
                <div class="panel-header">
                    <h2>Output Console</h2>
                </div>
                <div id="output" class="output"></div>
                <div id="error" class="error"></div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator hidden">
        <div class="spinner"></div>
        <p>Compiling Java...</p>
    </div>

    <!-- Application Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
